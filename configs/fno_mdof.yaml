# fno_mdof.yaml — Spatiotemporal 2D FNO Configuration for MDOF Shear Buildings

experiment_name: "fno_mdof_spatiotemporal"
seed: 42

data:
  dataset_type: "mdof"
  split_strategy: "held_out_earthquake"
  target_stories: 5
  target_time_steps: 2048
  target_channels:
    - "u"
    - "f_r"
    - "e_h"
  batch_size: 16

model:
  in_channels: 10
  out_channels: 3
  modes_spatial: 4      # Modes along story dimension
  modes_temporal: 64    # Modes along time dimension
  width: 32
  n_layers: 4
  activation: "gelu"

training:
  epochs: 40
  learning_rate: 0.003
  scheduler: "cosine"
  clip_grad_norm: 1.0

output:
  checkpoint_dir: "experiments/fno_mdof_spatiotemporal/checkpoints"
  results_dir: "experiments/fno_mdof_spatiotemporal/results"
